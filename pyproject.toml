[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "archivo",
    "dataset",
    "entrenamiento",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Estos puntos de entrada insertan la raíz para poder ejecutarse como scripts.
"tools/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
