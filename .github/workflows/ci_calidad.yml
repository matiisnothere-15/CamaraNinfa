name: CI - Auditoria y Calidad Monitor de Ninfas

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  calidad-y-contratos:
    runs-on: windows-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ejecutar Linter Estructural (Ruff)
        run: ruff check main.py app modulos tools tests

      - name: Verificar Contratos del Proyecto y Checkpoint SHA-256
        run: python tools/verificar_proyecto.py

      - name: Auditar Integridad y Cero Fugas del Dataset
        run: python tools/auditar_dataset.py

      - name: Ejecutar Suite de Pruebas (Pytest)
        run: pytest -v --tb=short
